name: Nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify
        run: SKIP_LIVE=1 npm run verify
      - name: Live tests against production
        run: LIVE_BASE_URL=https://yt-downloader-five-blush.vercel.app npm run test:live
      - name: File issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: 'ci-failure', state: 'open' });
            if (open.data.length === 0) {
              await github.rest.issues.create({ ...context.repo,
                title: `Nightly verify failed — ${new Date().toISOString().slice(0,10)}`,
                labels: ['ci-failure'],
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
